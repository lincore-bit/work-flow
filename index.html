<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>How I Work – Visual Systems</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">

  <!-- ===== TABOOLA ===== -->
  <section class="flow">
    <div class="node lincoln">LINCOLN</div>
    <div class="node source taboola">TABOOLA</div>

    <div class="publisher p1">NBC</div>
    <div class="publisher p2">BLOOMBERG</div>
    <div class="publisher p3">BUSINESS INSIDER</div>
    <div class="publisher p4">NDTV</div>

    <div class="node monetize">GOOGLE / YAHOO</div>

    <svg class="lines" viewBox="0 0 1200 420">
      <!-- BUY -->
      <path d="M140 210 C 240 120, 360 120, 480 200" class="buy"/>
      <text x="260" y="120" class="label buy-label">BUY TRAFFIC</text>

      <!-- PUB → MONETIZE -->
      <path d="M760 120 C 860 180, 940 200, 1020 210"/>
      <path d="M760 170 C 860 200, 940 210, 1020 210"/>
      <path d="M760 240 C 860 230, 940 220, 1020 210"/>
      <path d="M760 290 C 860 250, 940 230, 1020 210"/>

      <!-- REV -->
      <path d="M1020 260 C 760 360, 360 360, 140 250" class="rev"/>
      <text x="520" y="380" class="label rev-label">REV / PROFIT</text>
    </svg>
  </section>

  <!-- ===== OUTBRAIN ===== -->
  <section class="flow">
    <div class="node lincoln">LINCOLN</div>
    <div class="node source outbrain">OUTBRAIN</div>

    <div class="publisher p1">USA TODAY</div>
    <div class="publisher p2">CBS</div>
    <div class="publisher p3">WEATHER CHANNEL</div>
    <div class="publisher p4">THE HINDU</div>

    <div class="node monetize">GOOGLE / YAHOO</div>

    <svg class="lines" viewBox="0 0 1200 420">
      <path d="M140 210 C 260 130, 360 140, 480 210" class="buy"/>
      <text x="280" y="120" class="label buy-label">BUY TRAFFIC</text>

      <path d="M760 120 C 860 180, 940 200, 1020 210"/>
      <path d="M760 170 C 860 200, 940 210, 1020 210"/>
      <path d="M760 240 C 860 230, 940 220, 1020 210"/>
      <path d="M760 290 C 860 250, 940 230, 1020 210"/>

      <path d="M1020 260 C 760 360, 360 360, 140 250" class="rev"/>
      <text x="520" y="380" class="label rev-label">REV / PROFIT</text>
    </svg>
  </section>

  <!-- ===== GOOGLE ADS ===== -->
  <section class="flow">
    <div class="node lincoln">LINCOLN</div>
    <div class="node source google">GOOGLE ADS</div>

    <div class="sub s1">SEARCH</div>
    <div class="sub s2">DISPLAY</div>
    <div class="sub s3">PMAX</div>

    <div class="node monetize">GOOGLE / YAHOO</div>

    <svg class="lines" viewBox="0 0 1200 420">
      <path d="M140 210 C 260 120, 360 120, 480 200" class="buy"/>
      <text x="260" y="120" class="label buy-label">BUY TRAFFIC</text>

      <path d="M1020 260 C 760 360, 360 360, 140 250" class="rev"/>
      <text x="520" y="380" class="label rev-label">REV / PROFIT</text>
    </svg>
  </section>

</main>

</body>
</html>
